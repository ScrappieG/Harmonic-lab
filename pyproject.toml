[project]
name = "articuleet"
version = "0.1.0"
description = "ArticuLeet FastAPI backend running on Cloudflare Workers"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "openai>=1.0.0",
    "python-multipart"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]